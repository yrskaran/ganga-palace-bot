name: Backup repository

on:
  push:
    branches: [main]

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload repository backup
        uses: actions/upload-artifact@v4
        with:
          name: ganga-palace-bot-backup
          path: .
          include-hidden-files: true
          retention-days: 30
