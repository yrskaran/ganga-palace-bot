services:
  - type: web
    name: hotel-ai-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python serve.py
    autoDeploy: true
    envVars:
      - key: BOT_STORAGE_MODE
        value: demo
      - key: CUSTOMER_CONFIG_FILE
        value: customer_config.json
      - key: GRAPH_API_VERSION
        value: v26.0
      - key: WHATSAPP_TOKEN
        sync: false
      - key: PHONE_NUMBER_ID
        sync: false
      - key: VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: SHEET_ID
        sync: false
      - key: RECEPTION_PHONE
        sync: false
      - key: KITCHEN_PHONE
        sync: false
      - key: STAFF_PHONE
        sync: false
      - key: GROQ_API_KEY
        sync: false
