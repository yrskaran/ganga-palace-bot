description: Hotel production-entry conversation checks, isolated external I/O
providers:
  - id: python:../hotel_eval.py
prompts:
  - '{{question}}'
tests:
  - vars:
      question: Standard veg thali kitne ki hai?
    assert:
      - type: contains
        value: Standard Veg Thali
      - type: contains
        value: '200'
  - vars:
      question: Chai me kya kya option hai
    assert:
      - type: contains
        value: Cutting Chai
      - type: contains
        value: Masala Chai
# Run without Promptfoo cache for fresh model acceptance. Offline doubles,
# provider errors and fallback wording are separately labelled by hotel_eval.
